[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 460800
; Set these locally if auto-detect does not find your Nano's current USB serial port.
; Example:
; monitor_port = COM15
; upload_port = COM15
build_flags =
  -DCORE_DEBUG_LEVEL=0
