[platformio]
;pio run -e portenta_h7_m7 -t upload -v
;pio run -e nano_portenta_link_tester -t upload -v
;pio run -e portenta_nano _link_tester -t upload -v
default_envs = portenta_h7_m7
build_dir = .pio/build

[env:portenta_h7_m7]
platform = ststm32@19.4.0
board = portenta_h7_m7
framework = arduino
monitor_speed = 115200
monitor_port = COM11
upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-dfuutil-arduino/dfu-util.exe" -d 2341:035b -a 0 -s 0x08040000:leave -D "$SOURCE"
; Explicitly set the upload port if auto-detect fails before entering DFU mode
upload_port = COM11
; Ensure the 1200bps touch is active (usually default for this board)
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
build_flags =
  -Wall
  -Wextra
  -std=gnu++17
  -DPORTENTA_REMOTE_FLASH_HTTP_PORT=8080
  -DPORTENTA_STAGING_DIR=\"/staging\"
  -DPORTENTA_STATUS_BAUD=115200

[env:portenta_h7_m7_wifi]
extends = env:portenta_h7_m7
extra_scripts = pre:tools/wifi_credentials.py
build_flags =
  ${env:portenta_h7_m7.build_flags}
  -DPORTENTA_NETWORK_USE_WIFI=1
